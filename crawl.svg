<div class="view"><div class="crawl">
<div class="ep">EPISÓDIO IV</div>
<div class="tt">UMA NOVA PIPELINE</div>
<p>Tempos de turbulência na galáxia. Deploys manuais e servidores configurados à mão espalham o caos por todos os sistemas.</p>
<p>Um jovem desenvolvedor full-stack, vindo dos confins do Brasil, deixa a Orla Exterior do código e começa o treinamento nos caminhos do DevOps.</p>
<p>Com a certificação AWS no cinto e armado com Docker, Terraform e Ansible, ele parte em missão para automatizar a frota antes que o próximo deploy de sexta-feira destrua tudo…</p>
</div></div>
<div class="fade"></div>
<div class="intro">Há muito tempo, num servidor muito, muito distante…</div>
