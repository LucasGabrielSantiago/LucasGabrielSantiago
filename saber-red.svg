</defs>
<rect x="8" y="8" width="78" height="14" rx="3" fill="url(#metal)"/>
<rect x="20" y="8" width="4" height="14" fill="#2b3036"/><rect x="28" y="8" width="4" height="14" fill="#2b3036"/><rect x="36" y="8" width="4" height="14" fill="#2b3036"/>
<rect x="56" y="11" width="10" height="5" rx="1" fill="#ff4d5e"/>
<rect x="84" y="6" width="6" height="18" rx="1" fill="#555c64"/>
<rect x="90" y="9" height="12" rx="6" fill="#ff4d5e" filter="url(#glow)" width="0">
  <animate attributeName="width" from="0" to="800" dur="0.7s" begin="0.3s" fill="freeze"/>
